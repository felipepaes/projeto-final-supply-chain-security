name: Supply chain

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instala PDM
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdm "hishel<2.0"

      - name: Instala dependências e verifica lockfile
        run: |
          pdm config python.use_venv true
          pdm install --group test --check

      - name: Execução dos testes
        run: pdm run pytest

  build-scan-sign:
    name: Build, scan, e assinatura de imagem
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@refs/heads/${{ github.ref_name }}
      COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Prepare report directory
        run: mkdir -p security/artifacts

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: security/artifacts/sbom.cdx.json
          artifact-name: image-sbom
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: true

      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
      #     format: json
      #     output: security/artifacts/trivy-vulnerabilities.json
      #     vuln-type: os,library
      #     severity: HIGH,CRITICAL
      #     exit-code: "1"

      # - name: Upload scan reports
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: supply-chain-reports
      #     path: |
      #       security/artifacts/sbom.cdx.json
      #       security/artifacts/trivy-vulnerabilities.json
      #     if-no-files-found: warn

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest SBOM to image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate security/artifacts/sbom.cdx.json \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify SBOM attestation
        timeout-minutes: 3
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            --verbose \
            --timeout 90s \
            --type cyclonedx \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
